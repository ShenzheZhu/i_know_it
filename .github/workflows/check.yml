name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  popup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/iki-popup" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/iki-popup/node_modules/.bin/playwright" install --with-deps chromium
      - name: Popup interaction and state checks
        env:
          NODE_PATH: ${{ runner.temp }}/iki-popup/node_modules
        run: node check-popup.cjs
      - name: Isolated content-script integration
        env:
          NODE_PATH: ${{ runner.temp }}/iki-popup/node_modules
        run: xvfb-run --auto-servernum node check-context-browser.cjs
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Extension checks
        run: node check.cjs
      - name: Compile native checks
        run: xcrun swiftc native/main.swift -o "$RUNNER_TEMP/i-know-it-check"
      - name: Native state and input checks
        run: |
          node - "$RUNNER_TEMP/i-know-it-check" <<'NODE'
          const { spawn, spawnSync } = require('node:child_process');
          const child = spawn(process.argv[2], ['--self-test'], { stdio: 'inherit' });
          let timedOut = false;
          const timer = setTimeout(() => {
            timedOut = true;
            console.error('Native self-test exceeded 120 seconds; collecting a stack sample.');
            spawnSync('/usr/bin/sample', [String(child.pid), '1', '1'], {
              stdio: 'inherit', timeout: 15000, killSignal: 'SIGKILL',
            });
            child.kill('SIGKILL');
          }, 120000);
          child.once('error', error => {
            clearTimeout(timer);
            console.error(error);
            process.exitCode = 1;
          });
          child.once('exit', (code, signal) => {
            clearTimeout(timer);
            process.exitCode = timedOut || signal ? 1 : (code ?? 1);
          });
          NODE
      - name: Native process lifecycle
        run: node check-process.cjs
      - name: Image size matrix
        run: node check-images.cjs
      - name: Isolated installer regression (synthetic signing protocol)
        run: node check-install.cjs
