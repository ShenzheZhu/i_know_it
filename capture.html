<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Know It! · Capture</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f4f2; color: #242622; font: 14px system-ui, sans-serif; }
  header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; }
  p { margin: 4px 0; }
  button { font: inherit; padding: 9px 14px; border: 1px solid #767b6f; border-radius: 7px; background: white; color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  button:focus-visible { outline: 3px solid #5377b0; outline-offset: 3px; }
  main { display: grid; place-items: center; padding: 0 20px 20px; }
  #stage { position: relative; line-height: 0; touch-action: none; cursor: crosshair; user-select: none; }
  #shot { display: block; max-width: calc(100vw - 40px); max-height: calc(100vh - 160px); pointer-events: none; }
  #selection { position: absolute; border: 2px solid #2763cf; background: #2763cf18; pointer-events: none; }
  textarea { width: min(960px, 100%); height: 200px; margin-top: 16px; padding: 12px; font: 12px ui-monospace, monospace; }
  [hidden] { display: none !important; }
</style>
<header>
  <div><strong>I Know It!</strong><p id="status" role="status" aria-live="polite">Loading capture…</p></div>
  <div><button id="full" disabled>Capture visible page</button> <button id="close">Close</button></div>
</header>
<main>
  <div id="stage" hidden><img id="shot" alt="Captured web page. Drag to select a region." draggable="false"><div id="selection" hidden></div></div>
  <textarea id="text" aria-label="Screenshot context in Markdown" readonly hidden></textarea>
  <button id="copy" hidden>Copy Markdown</button>
</main>
<script type="module" src="capture.js"></script>
</html>
