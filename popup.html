<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>I Know It!</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f8f4; --card: #fff; --ink: #19291f; --muted: #5e7064; --line: #dce4dc; --accent: #286449; --off: #718679; --thumb: #fff; --error: #9b362a; }
    * { box-sizing: border-box; }
    body { width: 320px; max-width: 100vw; margin: 0; padding: 22px; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.6px; }
    .intro { margin: 5px 0 20px; color: var(--muted); font-size: 13px; }
    .control { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); cursor: pointer; }
    #switch-title { display: block; font-weight: 600; }
    #status { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .8px; }
    input { position: absolute; right: 16px; width: 48px; height: 28px; margin: 0; opacity: 0; cursor: pointer; }
    .track { flex: 0 0 48px; height: 28px; border-radius: 16px; background: var(--off); pointer-events: none; }
    .track::after { content: ""; display: block; width: 20px; height: 20px; margin: 4px; border-radius: 50%; background: var(--thumb); box-shadow: 0 1px 3px #0002; transition: transform .12s ease; }
    input:checked + .track { background: var(--accent); }
    input:checked + .track::after { transform: translateX(20px); }
    input:focus-visible + .track { outline: 3px solid var(--accent); outline-offset: 4px; }
    input:disabled + .track { opacity: .45; }
    #description { margin: 14px 0 0; min-height: 20px; color: var(--muted); font-size: 12px; }
    #error { margin: 10px 0 0; color: var(--error); font-size: 12px; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141c17; --card: #1e2922; --ink: #f1f6f0; --muted: #afc3b5; --line: #3b4c40; --accent: #80bd98; --off: #718679; --thumb: #fff; --error: #ffb3a8; }
    }
    @media (prefers-reduced-motion: reduce) { .track::after { transition: none; } }
  </style>
</head>
<body>
  <main aria-busy="true">
    <h1>I Know It!</h1>
    <p class="intro">Screenshot and paste as usual.</p>
    <label class="control">
      <span><span id="switch-title">Screenshot context</span><span id="status" aria-live="polite">LOADING</span></span>
      <input id="enabled" type="checkbox" role="switch" aria-labelledby="switch-title" aria-describedby="description" disabled>
      <span class="track" aria-hidden="true"></span>
    </label>
    <p id="description">Choose whether to include screenshot context.</p>
    <p id="error" role="status" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
